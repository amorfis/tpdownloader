# Credentials and the recipient address are not here: they come from .env, environment variables,
# or the Keychain (TPDOWNLOADER_SEND_TO for the recipient).

[mail]
send_subject = ""   # empty = use the file name
send_body = ""

# The reply to wait for (ASCII substrings, case-insensitive).
wait_from = "do-not-reply@amazon.com"
wait_subject = "Verify your Send to Kindle document request"
wait_timeout_minutes = 10
poll_interval_seconds = 30
